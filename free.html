<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Trial — DELUSIONAL &amp; ORGANIZED</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
      margin: 0;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #d9d9d9;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    a {
      color: #111111;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }

    .note {
      font-size: 13px;
      color: #444444;
      margin: 0 0 16px;
    }

    .box {
      border: 1px solid #d9d9d9;
      padding: 16px;
      margin-bottom: 18px;
      background: #ffffff;
    }

    .row {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      border: 1px solid #999999;
      background: #ffffff;
      color: #111111;
    }

    button {
      padding: 8px 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      border: 1px solid #111111;
      background: #ffffff;
      color: #111111;
      cursor: pointer;
    }

    button:hover {
      background: #f2f2f2;
    }

    .status {
      font-size: 13px;
      margin-top: 8px;
    }

    .mail-preview {
      border-top: 1px solid #d9d9d9;
      margin-top: 16px;
      padding-top: 14px;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <span>DELUSIONAL &amp; ORGANIZED — Free</span>
      <span>
        <a href="./index.html">Main</a> |
        <a href="./partnership.html">Partnership</a>
      </span>
    </div>

    <h1>Plain Free Invite (1–3 Sends)</h1>
    <p class="note">
      Basic white mail format. Limited options and 1 to 3 sends only (for quick fling invites).
      Enter code <strong>LOVE</strong> to unlock.
    </p>

    <div class="box" id="unlock-box">
      <form id="code-form">
        <div class="row">
          <label for="access-code">Free Code</label>
          <input type="text" id="access-code" name="accessCode" placeholder="Enter code" autocomplete="off" required />
        </div>
        <button type="submit">Apply Code</button>
        <div class="status" id="code-status"></div>
      </form>
    </div>

    <div class="box hidden" id="free-studio">
      <form id="free-invite-form">
        <div class="row">
          <label for="send-count">Number of Sends (1–3 max)</label>
          <input type="number" id="send-count" name="sendCount" min="1" max="3" value="1" required />
        </div>

        <div class="row">
          <label for="occasion">Type</label>
          <select id="occasion" name="occasion">
            <option value="Fling Invite">Fling Invite</option>
            <option value="Casual Hangout">Casual Hangout</option>
          </select>
        </div>

        <div class="row">
          <label for="to-name">To</label>
          <input type="text" id="to-name" name="toName" placeholder="Recipient name" required />
        </div>

        <div class="row">
          <label for="from-name">From</label>
          <input type="text" id="from-name" name="fromName" placeholder="Your name" required />
        </div>

        <div class="row">
          <label for="message">Short Note</label>
          <textarea id="message" name="message" rows="4" placeholder="Write a short invite..."></textarea>
        </div>

        <button type="submit">Generate Plain Mail</button>
        <button type="button" id="lock-btn">Lock Code</button>
        <div class="status" id="form-status"></div>
      </form>

      <div class="mail-preview" id="mail-preview"></div>
    </div>
  </div>

  <script>
    const FREE_CODE = "LOVE";
    const STORAGE_KEY = "delusional_free_code_unlocked";

    const codeForm = document.getElementById("code-form");
    const codeInput = document.getElementById("access-code");
    const codeStatus = document.getElementById("code-status");
    const unlockBox = document.getElementById("unlock-box");
    const freeStudio = document.getElementById("free-studio");
    const freeInviteForm = document.getElementById("free-invite-form");
    const formStatus = document.getElementById("form-status");
    const mailPreview = document.getElementById("mail-preview");
    const lockBtn = document.getElementById("lock-btn");

    function syncUnlockState() {
      const unlocked = localStorage.getItem(STORAGE_KEY) === "true";
      unlockBox.classList.toggle("hidden", unlocked);
      freeStudio.classList.toggle("hidden", !unlocked);
    }

    codeForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const entered = codeInput.value.trim().toUpperCase();
      if (entered === FREE_CODE) {
        localStorage.setItem(STORAGE_KEY, "true");
        codeStatus.textContent = "Unlocked.";
        codeInput.value = "";
        syncUnlockState();
      } else {
        codeStatus.textContent = "Invalid code.";
      }
    });

    lockBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      codeStatus.textContent = "";
      formStatus.textContent = "";
      mailPreview.textContent = "";
      syncUnlockState();
    });

    freeInviteForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const count = Number(document.getElementById("send-count").value);
      if (Number.isNaN(count) || count < 1 || count > 3) {
        formStatus.textContent = "Allowed sends: 1 to 3 only.";
        return;
      }

      const occasion = document.getElementById("occasion").value;
      const toName = document.getElementById("to-name").value.trim();
      const fromName = document.getElementById("from-name").value.trim();
      const message = document.getElementById("message").value.trim();

      formStatus.textContent = `Prepared for ${count} send(s).`;
      mailPreview.textContent =
        `Subject: ${occasion} (${count} send${count > 1 ? "s" : ""})\n` +
        `To: ${toName}\n` +
        `From: ${fromName}\n\n` +
        `${message}`;
    });

    syncUnlockState();
  </script>
</body>
</html>
